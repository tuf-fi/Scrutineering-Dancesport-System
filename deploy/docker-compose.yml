# The online server: BIS in cloud mode behind Caddy, which gets and renews the HTTPS certificate.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SYNC_TOKENS: ${SYNC_TOKENS:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      MESSENGER_PAGE_TOKEN: ${MESSENGER_PAGE_TOKEN:-}
      MESSENGER_PAGE_USERNAME: ${MESSENGER_PAGE_USERNAME:-}
      MESSENGER_VERIFY_TOKEN: ${MESSENGER_VERIFY_TOKEN:-}
      MESSENGER_APP_SECRET: ${MESSENGER_APP_SECRET:-}
    volumes:
      - bis-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # Copies the newest backups to another place every day. Start it with: docker compose --profile offsite up -d
  offsite:
    profiles: ["offsite"]
    image: rclone/rclone:1.68
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/offsite.sh"]
    volumes:
      - bis-data:/data:ro
      - ./offsite.sh:/offsite.sh:ro

volumes:
  bis-data:
  caddy-data:

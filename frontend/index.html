<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#171412" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIS</title>
    <style>
      body { margin: 0; }
      .boot-bar { height: 3.5rem; background: #000; }
      .boot-body { display: flex; flex-direction: column; gap: 1rem; max-width: 72rem; margin: 0 auto; padding: 2.5rem 1rem; }
      .boot-body i { display: block; border-radius: 6px; background: #e5e5e5; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-bar"></div>
      <div class="boot-body" aria-hidden="true">
        <i style="height: 2rem; width: 14rem"></i>
        <i style="height: 1rem; width: min(28rem, 80%)"></i>
        <i style="height: 14rem; margin-top: 1.5rem"></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
